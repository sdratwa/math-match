# Przykład dla dedykowanej subdomeny quiz.twojadomena.pl na OVH VPS.
# Zmień server_name, a po uruchomieniu HTTP skonfiguruj HTTPS (np. certbot --nginx).
server {
    listen 80;
    listen [::]:80;
    server_name quiz.twojadomena.pl;

    root /var/www/math-match/public;
    index index.php;
    charset utf-8;
    client_max_body_size 128k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
